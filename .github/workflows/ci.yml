name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        run: npx --yes expo-doctor
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Tests
        run: npm run test:ci

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
